name: eval

on:
  schedule:
    - cron: "0 7 * * *"   # nightly, 07:00 UTC
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model (blank = GEMINI_MODEL variable)"
        required: false

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
      GEMINI_MODEL: ${{ inputs.model || vars.GEMINI_MODEL }}
      ALLOWED_TABLES: ${{ vars.ALLOWED_TABLES }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://us.cloud.langfuse.com' }}
    steps:
      - uses: actions/checkout@v5
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVAL_SERVICE_ACCOUNT }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Full golden-set eval, gated against baseline (max drop 3 pts)
        run: uv run python -m evals.run_evals --gate --max-drop 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
