[project]
name = "warehouse-copilot"
version = "0.1.0"
description = "Text-to-SQL analytics agent with an MCP server and a human approval step"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "langchain>=1.4,<2",
    "langchain-google-genai>=4.4,<5",
    "langchain-mcp-adapters>=0.3,<0.4",
    "mcp>=2.3,<3",
    "sqlglot>=30,<31",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic>=2",
    "pyyaml",
    "pandas",
    "streamlit>=1.66,<2",
    "langfuse>=5,<6",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs a live database connection (DATABASE_URL)"]

[tool.ruff]
line-length = 100
